[package]
name = "homeserver-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "homeserver-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
sysinfo = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
tower-http = { version = "0.7.1", features = ["cors"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
